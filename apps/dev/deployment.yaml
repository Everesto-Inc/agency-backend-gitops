apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-backend
  labels: { app: agency-backend, everesto.live/project: orchid, everesto.live/env: dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: agency-backend } }
  template:
    metadata:
      labels: { app: agency-backend, everesto.live/project: orchid, everesto.live/env: dev }
    spec:
      nodeSelector: { everesto.live/pool: tenants }
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ghcr.io/everesto-inc/agency-backend
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: agency-backend }   # secrets: Infisical agency-backend-gitops / dev (via ESO)
          resources:
            requests: { cpu: 25m, memory: 512Mi }
            limits: { memory: 1024Mi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 20, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
