# All secrets of Infisical project "orchid-agency-backend-gitops" (older apps: "agency-backend-gitops"), env dev → Secret "agency-backend"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agency-backend
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: infisical-agency-backend-dev }
  target: { name: agency-backend }
  dataFrom:
    - find: { name: { regexp: ".*" } }
