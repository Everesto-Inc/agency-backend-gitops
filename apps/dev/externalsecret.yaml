# All secrets of Infisical project "orchid-agency-backend-gitops" (older apps: "agency-backend-gitops"), env dev → Secret "agency-backend"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agency-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # the Secret must exist before the migrate / eval-user Jobs (waves -2 / -1)
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: infisical-agency-backend-dev }
  target: { name: agency-backend }
  dataFrom:
    - find: { name: { regexp: ".*" } }
