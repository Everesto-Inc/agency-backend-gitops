# Agency on the control-plane — 6 services. Edited by hand (platform exception); see README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  labels: { app: edge-gateway, app.kubernetes.io/part-of: agency }
spec:
  replicas: 1
  strategy: { type: Recreate }   # no surge pod: the namespace quota has no room for two copies
  selector: { matchLabels: { app: edge-gateway } }
  template:
    metadata:
      labels: { app: edge-gateway, app.kubernetes.io/part-of: agency }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }   # agency runs on the control-plane (platform exception, 3 GiB quota)
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: ghcr.io/everesto-inc/agency-edge-gateway
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: SERVICE_NAME, value: "edge-gateway" }
            - { name: ENVIRONMENT, value: "dev" }
            - { name: LOG_LEVEL, value: "INFO" }
            - { name: LOG_JSON, value: "true" }
            - { name: CONFIG_DIR, value: "/app/config" }
            - { name: PROMPTS_DIR, value: "/app/prompts" }
            - { name: MODEL_GATEWAY_URL, value: "http://model-gateway:8000" }
            - { name: HOME, value: "/tmp" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: agency-backend, key: DATABASE_URL } } }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: agency-backend, key: REDIS_URL } } }
            - { name: REDIS_KEY_PREFIX, valueFrom: { secretKeyRef: { name: agency-backend, key: REDIS_KEY_PREFIX } } }
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: agency-backend, key: JWT_SECRET_KEY } } }
            - { name: CORS_ALLOWED_ORIGINS, valueFrom: { secretKeyRef: { name: agency-backend, key: CORS_ALLOWED_ORIGINS } } }
            - { name: MODEL_GATEWAY_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: agency-backend, key: EDGE_GATEWAY_SECRET } } }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 3, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
spec:
  selector: { app: edge-gateway }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
